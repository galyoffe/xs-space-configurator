
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XS.Space Configurator</title>
  <style>
    :root { 
      --bg:#0f1317; --panel:#1b2229; --muted:#94a3b8; --text:#e6edf3; --accent:#ff7f32; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, Arial, sans-serif; background:var(--bg); color:var(--text); }
    header { position:sticky; top:0; background:linear-gradient(180deg,#11161c,#0f131700); z-index:10; border-bottom:1px solid #222c36; }
    .container { max-width:1160px; margin:0 auto; padding:16px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand img { height:28px; }
    .stepper { display:flex; gap:6px; margin-top:10px; }
    .chip { padding:6px 10px; border-radius:999px; background:#0f1720; border:1px solid #243041; font-size:12px; color:var(--muted); }
    .chip.active { background:var(--panel); color:var(--text); border-color:#334155; }
    main { padding:24px 0 140px; }
    .card { background:var(--panel); border:1px solid #243041; border-radius:12px; padding:16px; }
    .row { display:flex; gap:16px; flex-wrap:wrap; }
    .col { flex:1 1 300px; min-width:280px; }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
    input, select, textarea { width:100%; padding:10px 12px; border-radius:10px; border:1px solid #2d3948; background:#0f1720; color:var(--text); }
    textarea { min-height:120px; resize:vertical; }
    button { background:var(--accent); color:#111; border:none; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:600; }
    button.ghost { background:transparent; color:var(--text); border:1px solid #334155; }
    .hidden { display:none; }
    .footerbar { position:fixed; left:0; right:0; bottom:0; background:#0b0f13; border-top:1px solid #243041; }
    .price-grid { display:grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap:10px; }
    .pill { background:#0f1720; border:1px solid #243041; padding:8px 10px; border-radius:999px; font-size:12px; color:#cbd5e1; }
    .pill strong { color:#e2e8f0; }
    /* Status dot styles for field classification */
    .status-dot {
      display:inline-block;
      width:8px;
      height:8px;
      border-radius:50%;
      margin-left:6px;
      vertical-align:middle;
    }
    .status-auto { background: var(--ok); }
    .status-estimated { background: var(--warn); }
    .status-user { background: var(--muted); }
    .legend {
      font-size:12px;
      margin:8px 0;
      color:var(--muted);
    }
    .legend-dot {
      display:inline-block;
      width:8px;
      height:8px;
      border-radius:50%;
      margin-right:4px;
    }
    .legend .auto { background: var(--ok); }
    .legend .estimated { background: var(--warn); }
    .legend .user { background: var(--muted); }
    .chat { height:320px; overflow:auto; border-radius:10px; border:1px solid #243041; padding:12px; background:#0f1720; }
    .msg { margin-bottom:12px; }
    .msg b { font-size:12px; color:#93c5fd; }
    .msg.user b { color:#a7f3d0; }
    .assumption { font-size:12px; color:#fbbf24; }
  </style>
</head>

      <div class="stepper">
        <div class="chip active" id="stepChipA">A · Chat</div>
        <div class="chip" id="stepChipB">B · Configure</div>
        <div class="chip">Review</div>
        <div class="chip">Quote</div>
      </div>

  </header>
  <main class="container">
    <!-- Phase A: Conversational intake -->
    <section id="phaseA" class="card">
      <h3 style="margin-top:0">Phase A — Describe your demo</h3>
      <div class="chat" id="chatBox"></div>
      <div class="row" style="margin-top:12px;">
        <div class="col" style="flex:1 1 100%;">
          <label>Type your prompt</label>
          <textarea id="prompt" placeholder="e.g., We want to test a 6U materials science payload on ISS for 60 days. 12 kg max, 20 W average, S-band telemetry, no propulsion. Target TRL 7 and first light in 72 hours."></textarea>
        </div>
      </div>
      <div class="row">
        <div class="col">
          <button id="btnAsk">Ask the agent</button>
          <button class="ghost" id="btnImDone">I'm done — summarize</button>
          <button class="ghost hidden" id="btnProceed">Confirm & proceed to configuration</button>
        </div>
      </div>
      <div id="assumptions" class="assumption"></div>
    </section>

    <!-- Phase B: Destination-first form -->
    <section id="phaseB" class="card hidden" style="margin-top:18px;">
      <h3 style="margin-top:0">Phase B — Configure</h3>

      <div class="row">
        <div class="col">
          <label for="dest">Destination</label>
          <select id="dest">
            <option value="free_fly">Free-Fly (LEO/SSO/GEO)</option>
            <option value="space_station">Space Station</option>
            <option value="mars">Mars</option>
          </select>
        </div>
        <div class="col">
          <label for="mission_name">Mission name</label>
          <input id="mission_name" placeholder="Project Falcon Demo" />
        </div>
        <div class="col">
          <label for="org_type">Org type</label>
          <select id="org_type">
            <option>research_lab</option><option>startup</option><option>SME</option>
            <option>corporate</option><option>government</option>
          </select>
        </div>
        <div class="col">
          <label for="org_country">Country (legal entity)</label>
          <input id="org_country" placeholder="IL" value="IL"/>
        </div>
      </div>

      <!-- Shared core -->
      <div class="row" style="margin-top:8px;">
        <div class="col"><label for="current_trl">Current TRL</label><select id="current_trl"></select></div>
        <div class="col"><label for="target_trl">Target TRL</label><select id="target_trl"></select></div>
        <div class="col"><label for="mass">Payload mass (kg)</label><input id="mass" type="number" min="0.1" step="0.1" /></div>
        <div class="col"><label for="pwr_avg">Power avg (W)</label><input id="pwr_avg" type="number" min="0" /></div>
        <div class="col"><label for="pwr_peak">Power peak (W)</label><input id="pwr_peak" type="number" min="0" /></div>
      </div>
      <div class="row">
        <div class="col"><label for="rf">RF bands</label>
          <select id="rf" multiple>
            <option>none</option><option>UHF</option><option>S</option><option>X</option><option>Ka</option>
          </select>
        </div>
        <div class="col"><label for="pointing">Pointing</label>
          <select id="pointing"><option>none</option><option>coarse</option><option>fine</option></select>
        </div>
        <div class="col"><label for="duration">Duration (days)</label><input id="duration" type="number" min="1" value="30" /></div>
        <div class="col"><label for="launch_q">Target launch quarter</label><input id="launch_q" placeholder="2026-Q3" /></div>
      </div>

      <!-- Free-fly fields -->
      <div id="ff_fields" class="row hidden">
        <div class="col"><label for="orbit_class">Orbit class</label>
          <select id="orbit_class"><option>LEO</option><option>SSO</option><option>GEO</option></select>
        </div>
        <div class="col"><label for="form_factor">Form factor</label>
          <select id="form_factor"><option>3U</option><option>6U</option><option>12U</option><option>custom</option></select>
        </div>
        <div class="col"><label for="propulsion">Propulsion</label>
          <select id="propulsion"><option>none</option><option>electric</option><option>monoprop</option><option>biprop</option></select>
        </div>
      </div>

      <!-- Space station fields -->
      <div id="ss_fields" class="row hidden">
        <div class="col"><label for="facility">Facility</label>
          <select id="facility"><option>internal rack</option><option>external platform</option></select>
        </div>
        <div class="col"><label for="crew_hrs">Crew time (hrs)</label><input id="crew_hrs" type="number" min="0" value="0"/></div>
        <div class="col"><label for="return_disposal">Return or disposal</label><select id="return_disposal"><option>return</option><option>disposal</option></select></div>
      </div>

      <!-- Mars fields -->
      <div id="mars_fields" class="row hidden">
        <div class="col"><label for="mars_type">Mission type</label><select id="mars_type"><option>flyby</option><option>orbiter</option><option>lander</option><option>hosted</option></select></div>
        <div class="col"><label for="pp">Planetary Protection</label><select id="pp"><option>PP-I</option><option>PP-II</option><option>PP-III+</option></select></div>
        <div class="col"><label for="dsn">DSN Plan</label><select id="dsn"><option>X</option><option>Ka</option></select></div>
      </div>

      <!-- Toggles -->
      <div class="row" style="margin-top:8px;">
        <div class="col"><label for="eligible">Eligible for IIA/ISA −35%</label><select id="eligible"><option>true</option><option>false</option></select></div>
        <div class="col"><label for="rush">Rush timeline</label><select id="rush"><option>none</option><option>+10%</option><option>+20%</option><option>+30%</option></select></div>
      </div>

      <!-- Legend for classification statuses -->
      <div class="legend">
        <span class="legend-dot auto"></span>Auto
        <span class="legend-dot estimated" style="margin-left:12px;"></span>Estimated
        <span class="legend-dot user" style="margin-left:12px;"></span>User Input
      </div>

      <!-- Advanced configuration: collapsible section for additional parameters -->
      <!-- The "open" attribute ensures the section is expanded by default; users can collapse it if desired -->
      <details id="adv_toggle" open style="margin-top:16px;">
        <summary style="cursor:pointer; font-size:14px; color:var(--accent); font-weight:bold;">Advanced configuration (optional)</summary>
        <div id="advancedSection" style="margin-top:8px;"></div>
      </details>

    </section>
  </main>

  <footer class="footerbar">
    <div class="container" style="padding:12px 16px;">
      <div id="priceTotal" style="font-weight:800; font-size:18px; margin-bottom:8px;">Total: —</div>
      <div class="price-grid" id="chips"></div>
    </div>
  </footer>

<script>

function parsePrompt(p) {
  const txt = p.toLowerCase();
  // destination
  // Preserve current destination by default; only change when new cues are present.
  let destCandidate = draft.destination || 'free_fly';
  // Identify explicit keywords. Match 'iss' only when it's a whole word (to avoid matching 'mission'), detect explicit phrases.
  const mentionsStation = /\biss\b/.test(txt) || txt.includes('space station') || txt.includes('space-station');
  const mentionsMars = txt.includes('mars');
  // If the prompt mentions crew involvement, pressurized environment or in-situ operation, lean towards the space station
  const stationIndicators = /(crew|operator|astronaut|pressurised|pressurized|manned|in\s?situ|human|on\s?board|operator available)/;
  const mentionsCrew = stationIndicators.test(txt);
  if (mentionsMars) {
    destCandidate = 'mars';
  } else if (mentionsStation || mentionsCrew) {
    destCandidate = 'space_station';
  }
  draft.destination = destCandidate;
  // form factor / mass
  if (txt.includes('6u')) draft.form_factor='6U';
  else if (txt.includes('12u')) draft.form_factor='12U';
  else if (txt.includes('3u')) draft.form_factor='3U';
  const m = txt.match(/(\d+(?:\.\d+)?)\s*kg/);
  if (m) draft.mass = parseFloat(m[1]);
  const pw = txt.match(/(\d+(?:\.\d+)?)\s*w/);
  if (pw) draft.pwr_avg = parseFloat(pw[1]);
  if (txt.includes('s-band') && !draft.rf.includes('S')) draft.rf.push('S');
  if (txt.includes('x-band') && !draft.rf.includes('X')) draft.rf.push('X');
  if (txt.includes('ka') && !draft.rf.includes('Ka')) draft.rf.push('Ka');
  if (txt.match(/trl\s*([4-8])/)) draft.target_trl = parseInt(RegExp.$1);
  if (txt.match(/(\d+)\s*(days|day)/)) draft.duration = parseInt(RegExp.$1);
  if (txt.includes('precision') || txt.includes('<0.5') || (txt.includes('fine') && txt.includes('pointing'))) draft.pointing='fine';
}

function missingBlocking(dest) {
  const need = [];
  if (!draft.mass) need.push('payload mass (kg)');
  if (!draft.pwr_avg) need.push('average power (W)');
  if (dest==='free_fly' && !draft.form_factor) need.push('form factor (3U/6U/12U)');
  if (dest==='space_station' && draft.crew_hrs==null) need.push('crew time (hrs)');
  if (dest==='mars' && !draft.pp) need.push('planetary protection level');
  return need;
}

document.getElementById('btnAsk').onclick = () => {
  const promptEl = document.getElementById('prompt');
  const p = promptEl.value.trim();
  if (!p) return;
  // Display user message and clear the textarea
  addMsg('user', p);
  promptEl.value = '';
  // Reset height to auto so that next line starts small
  promptEl.style.height = 'auto';
  // Provide basic guidance if the user is asking for help choosing a destination
  const lower = p.toLowerCase();
  if (lower.includes('help') && (lower.includes('destination') || lower.includes('decision') || lower.includes('decide'))) {
    addMsg('agent', `Choosing a destination depends on your mission objectives.<br/>• <strong>Space Station</strong> – for experiments requiring astronaut involvement, human tending, pressurised environment and easy return of hardware.<br/>• <strong>Free‑Fly</strong> – when you need a dedicated satellite in LEO/SSO/GEO with autonomy and no crew involvement.<br/>• <strong>Mars/Deep Space</strong> – for demonstrations that require planetary conditions or deep‑space environment and higher TRL.<br/>Let me know which scenario best fits your demo.`);
    return;
  }
  // Parse the prompt to update the draft with any detected parameters
  parsePrompt(p);
  const need = missingBlocking(draft.destination);
  if (need.length) {
    addMsg('agent', `Thanks! To configure, I still need:<br/><ul><li>${need.join('</li><li>')}</li></ul>`);
  } else {
    if (!conversationSummarized) {
      addMsg('agent', `Great, I have enough information for a draft. You can continue adding more details or click "I'm done — summarize" when ready.`);
    } else {
      addMsg('agent', `Got it — I've updated your mission details. Feel free to add more information or click "I'm done — summarize" again to regenerate the summary.`);
    }
  }
};

// ---------- Pricing engine ----------
let price = { total: 0, lines: [] };

function catalogFind(nameContains) {
  return CATALOG.find(x => x.name.toLowerCase().includes(nameContains.toLowerCase()));
}

function addLine(id, label, amount, kind) {
  price.lines.push({id, label, amount, kind});
}

function formatUSD(n) {
  return n==null? '—' : '$' + n.toLocaleString('en-US', {maximumFractionDigits:0});
}

function recalcPrice() {
  price = { total: 0, lines: [] };
  const eligible = document.getElementById('eligible').value==='true';
  const rushSel = document.getElementById('rush').value;
  const rush = rushSel==='none'?0: (rushSel.includes('10')?0.10:rushSel.includes('20')?0.20:0.30);

  // Pass-through based on dest & form factor
  const dest = document.getElementById('dest').value;
  const form = (document.getElementById('form_factor')||{value:'3U'}).value;
  if (dest==='space_station') {
    const iss = catalogFind('ISS 3U');
    addLine('pt_iss', iss?.name||'Launch & Platform (ISS 3U, 90 days)', iss?.price_usd||352000, 'pass');
  } else if (dest==='free_fly') {
    if (form==='3U') {
      const l3 = catalogFind('LEO 3U');
      addLine('pt_leo3u', l3?.name||'Launch & Platform (LEO 3U Basic)', l3?.price_usd||385000, 'pass');
    } else if (form==='6U') {
      const l6 = catalogFind('LEO 6U');
      addLine('pt_leo6u', l6?.name||'Launch & Platform (LEO 6U High-End)', l6?.price_usd||935000, 'pass');
    } else {
      const l6 = catalogFind('LEO 6U');
      addLine('pt_leo12u', l6?.name||'Launch & Platform (LEO 6U High-End)', (l6?.price_usd||935000)*1.6, 'pass');
    }
  } else if (dest==='mars') {
    // No fixed pass-through; placeholder for transfer
    addLine('pt_ds', 'Deep-space transfer (est.)', 4000000, 'pass');
  }

  // Service bases
  const base = catalogFind(dest==='mars' ? 'Base XS.Space Services (Deep Space)' : 'Base XS.Space Services (LEO/ISS)');
  let services = 0;
  services += base?.price_usd || (dest==='mars'?580000:270000);

  // AIT
  const ait = catalogFind(dest==='mars' ? 'AIT & Testing (Extended' : 'AIT & Testing (Standard)');
  services += ait?.price_usd || (dest==='mars'?300000:100000);

  // Ops
  const ops = catalogFind(dest==='space_station' ? 'Operations (90 days, ISS)' : 'Operations (30 days, LEO)');
  services += ops?.price_usd || (dest==='space_station'?75000:50000);

  // Regulatory (1 included) + maybe extra if imaging band selected
  const rfSel = Array.from(document.getElementById('rf').selectedOptions).map(o=>o.value);
  const extraReg = (rfSel.includes('X') ? 20000 : 0);
  services += extraReg;

  // Options: propulsion & precision ADCS
  const prop = document.getElementById('propulsion')?.value||'none';
  if (prop==='electric') services += (catalogFind('Propulsion Add-on (Electric)')?.price_usd||450000);
  const pointing = document.getElementById('pointing').value;
  if (pointing==='fine' && dest!=='space_station') services += (catalogFind('ADCS Upgrade')?.price_usd||495000);

  // Apply rush on service lines only
  const rushAmt = services * rush;

  // Apply subsidy on services only
  const subsidy = eligible ? services * 0.35 : 0;

  // Build service lines
  addLine('svc_base', base?.name||'Base XS.Space Services', (base?.price_usd)||(dest==='mars'?580000:270000), 'svc');
  addLine('svc_ait', ait?.name||'AIT & Testing', (ait?.price_usd)||(dest==='mars'?300000:100000), 'svc');
  addLine('svc_ops', ops?.name||'Operations', (ops?.price_usd)||(dest==='space_station'?75000:50000), 'svc');
  if (extraReg) addLine('svc_reg_extra', 'Regulatory (extra filing)', extraReg, 'svc');
  if (prop==='electric') addLine('opt_prop', 'Propulsion Add-on (Electric)', catalogFind('Propulsion Add-on (Electric)')?.price_usd||450000, 'svc');
  if (pointing==='fine' && dest!=='space_station') addLine('opt_adcs', 'ADCS Upgrade (Precision)', catalogFind('ADCS Upgrade')?.price_usd||495000, 'svc');

  if (rushAmt) addLine('svc_rush', `Rush (${rushSel})`, rushAmt, 'svc');
  if (subsidy) addLine('disc_subsidy', 'IIA/ISA Subsidy (−35% on services)', -subsidy, 'disc');

  // Sum
  const passTotal = price.lines.filter(l=>l.kind==='pass').reduce((a,b)=>a+(b.amount||0),0);
  const svcTotal  = price.lines.filter(l=>l.kind!=='pass').reduce((a,b)=>a+(b.amount||0),0);
  price.total = passTotal + svcTotal;

  // Render
  document.getElementById('priceTotal').innerText = 'Total: ' + formatUSD(price.total);
  const chips = document.getElementById('chips'); chips.innerHTML='';
  const addChip = (label, amt) => {
    const c = document.createElement('div'); c.className='pill'; c.innerHTML = `<strong>${label}:</strong> ${formatUSD(amt)}`; chips.appendChild(c);
  };
  addChip('Pass-through', passTotal);
  addChip('Services & Options', svcTotal + (subsidy?subsidy:0) - (rushAmt?rushAmt:0)); // before rush & subsidy adjustments
  if (rushAmt) addChip('Rush', rushAmt);
  if (subsidy) addChip('Subsidy', -subsidy);
  addChip('Grand Total', price.total);
}

// ---------- Field status tracking ----------
// missionData holds the current values and status (auto, estimated, user) for each field in Phase B
let missionData = {};

// Retrieve the value of an input/select/textarea element
function getValueFromElement(el) {
  if (!el) return null;
  if (el.tagName === 'SELECT' && el.multiple) {
    return Array.from(el.selectedOptions).map(o => o.value);
  }
  if (el.type === 'number') {
    return el.value ? parseFloat(el.value) : null;
  }
  return el.value;
}

// Update the status dot for a given field id
function updateFieldStatus(id, status) {
  const dot = document.getElementById('status-' + id);
  if (dot) {
    dot.classList.remove('status-auto', 'status-estimated', 'status-user');
    if (status === 'auto') dot.classList.add('status-auto');
    else if (status === 'user') dot.classList.add('status-user');
    else dot.classList.add('status-estimated');
  }
  const el = document.getElementById(id);
  if (el) {
    el.dataset.status = status;
  }
}

// Add status dots to all labels in Phase B and attach change listeners to inputs
function setupStatusTracking() {
  // Add status dots to labels if missing
  document.querySelectorAll('#phaseB label').forEach(label => {
    const forId = label.getAttribute('for');
    if (!forId) return;
    if (!label.querySelector('.status-dot')) {
      const dot = document.createElement('span');
      dot.className = 'status-dot status-estimated';
      dot.id = 'status-' + forId;
      label.appendChild(dot);
    }
  });
  // Attach change listeners to mark user modifications
  document.querySelectorAll('#phaseB input, #phaseB select, #phaseB textarea').forEach(el => {
    el.addEventListener('change', () => {
      updateFieldStatus(el.id, 'user');
      missionData[el.id] = { value: getValueFromElement(el), status: 'user' };
    });
  });
}

// Apply statuses (auto vs estimated) based on values detected from draft
function applyStatusesFromDraft() {
  // Build missionData for all fields
  const rfDraft = draft.rf || [];
  document.querySelectorAll('#phaseB input, #phaseB select, #phaseB textarea').forEach(el => {
    const id = el.id;
    let hasValue = false;
    let value = null;
    if (id === 'rf') {
      hasValue = rfDraft && rfDraft.length > 0;
      value = Array.from(el.selectedOptions).map(o => o.value);
    } else if (id in draft) {
      const dval = draft[id];
      if (dval !== undefined && dval !== null && dval !== '') {
        hasValue = true;
        value = dval;
      }
    }
    const status = hasValue ? 'auto' : 'estimated';
    updateFieldStatus(id, status);
    missionData[id] = { value: getValueFromElement(el), status };
  });
}

function buildAdvancedSection() {
  const container = document.getElementById('advancedSection');
  if (!container) return;
  advancedDefinition.forEach(group => {
    // Group title
    const title = document.createElement('h4');
    title.textContent = group.group;
    title.style.marginTop = '16px';
    title.style.fontSize = '15px';
    title.style.color = 'var(--accent)';
    container.appendChild(title);
    // Row to hold fields
    const row = document.createElement('div');
    row.className = 'row';
    group.fields.forEach(field => {
      const col = document.createElement('div');
      col.className = 'col';
      const label = document.createElement('label');
      label.textContent = field.label;
      label.setAttribute('for', field.id);
      let input;
      if (field.type === 'select') {
        input = document.createElement('select');
        field.options.forEach(opt => {
          const option = document.createElement('option');
          option.value = opt;
          option.textContent = opt;
          input.appendChild(option);
        });
      } else if (field.type === 'textarea') {
        input = document.createElement('textarea');
        input.rows = 3;
      } else {
        input = document.createElement('input');
        input.type = field.type;
        if (field.min !== undefined) input.min = field.min;
      }
      input.id = field.id;
      col.appendChild(label);
      col.appendChild(input);
      row.appendChild(col);
    });
    container.appendChild(row);
  });
}

// ---------- Prompt input enhancements ----------
// Allow pressing Enter to send and Shift+Enter for a new line. Auto-resize the textarea
// height as the user types so that all text is visible without scrollbars.
(() => {
  const promptEl = document.getElementById('prompt');
  promptEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('btnAsk').click();
    }
  });
  promptEl.addEventListener('input', () => {
    promptEl.style.height = 'auto';
    // Limit max height to avoid stretching too far
    const maxHeight = 300;
    promptEl.style.height = Math.min(promptEl.scrollHeight, maxHeight) + 'px';
  });
})();

// Initialize advanced section after catalog is loaded and base UI is ready
loadCatalog().then(() => {
  recalcPrice();
  buildAdvancedSection();
});
